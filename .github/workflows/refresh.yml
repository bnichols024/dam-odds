name: Refresh odds and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # every morning (6:17 AM Pacific)
    - cron: '17 13 * * *'
    # Saturday game days, hourly from 9 AM to midnight Pacific
    - cron: '7 16-23 * * 6'
    - cron: '7 0-7 * * 0'
    # Tuesday nights after the CFP committee rankings come out
    - cron: '37 1,3 * * 3'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build snapshot (ESPN -> ratings -> simulations)
        env:
          SIMS: '20000'
          LEV_SIMS: '6000'
          REPLAY_SIMS: '6000'
          MAX_AGE_MS: '0'
        run: node pipeline/build.js
      - name: Commit data
        run: |
          git config user.name "dam-odds bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/snapshot.json site/data/history.json
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "Refresh odds $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
